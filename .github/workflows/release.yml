# Pushing a version tag (git tag v1.2.0 && git push origin v1.2.0) runs the tests,
# builds SproutStudio-1.2.0.dmg and publishes it as a GitHub Release.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # needed to create the Release

jobs:
  release:
    runs-on: macos-latest   # Apple Silicon (arm64)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: ./gradlew test --no-daemon -PappVersion=${{ steps.version.outputs.value }}

      - name: Build .dmg
        run: ./gradlew packageDmg --no-daemon -PappVersion=${{ steps.version.outputs.value }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          dmg=$(ls build/compose/binaries/main/dmg/*.dmg)
          # This version's section of CHANGELOG.md, without its heading; GitHub's own notes if it has none.
          awk -v v="$VERSION" '$0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" "$dmg" \
            --title "SproutStudio $VERSION" \
            "${notes[@]}"

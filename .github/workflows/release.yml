# Pushing a version tag (git tag v1.2.0 && git push origin v1.2.0) runs the tests on macOS,
# Windows and Linux, builds the .dmg, the .msi, the .deb and a Linux .tar.gz, and publishes them
# all in one GitHub Release.
name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    strategy:
      fail-fast: false   # a failure on one OS must not cancel the other: both results are needed
      matrix:
        include:
          - os: macos-latest      # Apple Silicon (arm64)
            task: packageDmg
            format: dmg
          - os: windows-latest    # x64; the Compose plugin downloads WiX for the .msi
            task: packageMsi
            format: msi
          - os: ubuntu-latest     # x64; jpackage builds the .deb with the runner's dpkg
            task: packageDeb
            format: deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The UI tests need a display; Linux runners have none, so a virtual one (Xvfb).
      - name: Test
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}./gradlew test --no-daemon -PappVersion=${{ steps.version.outputs.value }}

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: build/reports/tests/test
          retention-days: 7

      - name: Build .${{ matrix.format }}
        run: |
          ./gradlew ${{ matrix.task }} --no-daemon -PappVersion=${{ steps.version.outputs.value }}
          mkdir -p dist
          cp build/compose/binaries/main/${{ matrix.format }}/*.${{ matrix.format }} dist/

      # For distributions without dpkg (Fedora, Arch...): the app folder with its own Java; unpack and run its bin/ launcher.
      - name: Build Linux .tar.gz
        if: runner.os == 'Linux'
        run: |
          ./gradlew createDistributable --no-daemon -PappVersion=${{ steps.version.outputs.value }}
          tar -czf "dist/SproutStudio-${{ steps.version.outputs.value }}-linux-x64.tar.gz" -C build/compose/binaries/main/app .

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.format }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build   # only when every installer built and passed its tests
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          # This version's section of CHANGELOG.md, without its heading; GitHub's own notes if it has none.
          awk -v v="$VERSION" '$0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" installers/* \
            --title "SproutStudio $VERSION" \
            "${notes[@]}"

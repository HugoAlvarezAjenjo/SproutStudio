# Builds and runs the tests on every push and pull request. Publishes nothing.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]   # tags are handled by release.yml
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false   # a Windows failure must not hide the macOS result, or the reverse
      matrix:
        os: [macos-latest, windows-latest]   # macOS on Apple Silicon (arm64)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash   # Git Bash on Windows, so ./gradlew works the same everywhere
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: build/reports/tests/test
          retention-days: 7

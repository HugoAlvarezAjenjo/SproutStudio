# Builds and runs the tests on every push and pull request. Publishes nothing.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]   # tags are handled by release.yml
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false   # a failure on one OS must not hide the others' results
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]   # macOS on Apple Silicon (arm64)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash   # Git Bash on Windows, so ./gradlew works the same everywhere
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The UI tests need a display; Linux runners have none, so a virtual one (Xvfb).
      - name: Test
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}./gradlew test --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: build/reports/tests/test
          retention-days: 7

      # The .deb puts the `sproutstudio` command on the PATH: install it for real and run it from
      # there, then check that uninstalling takes the command away too.
      - name: Install the .deb and run sproutstudio
        if: runner.os == 'Linux'
        run: |
          ./gradlew packageDeb --no-daemon
          # The package's own install script (jpackage's) adds the menu entry with xdg-desktop-menu,
          # which fails without the menu folders every desktop has. The runner has no desktop.
          sudo mkdir -p /etc/xdg/menus /usr/share/applications /usr/share/desktop-directories
          sudo apt-get install -y ./build/compose/binaries/main/deb/*.deb
          test "$(command -v sproutstudio)" = /usr/bin/sproutstudio
          sproutstudio --help
          sproutstudio --check samples
          if sproutstudio --check no-such-folder; then echo "a missing folder must fail"; exit 1; fi
          sudo apt-get remove -y sproutstudio
          test ! -e /usr/bin/sproutstudio
